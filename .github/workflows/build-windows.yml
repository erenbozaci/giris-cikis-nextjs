name: Windows kurulum dosyası

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # better-sqlite3 hazır N-API binary'si ile geliyor, derlemeye gerek yok;
      # electron-builder de kendi Electron paketini indiriyor.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      - run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: GirisCikis-Kurulum
          path: dist/*.exe
          if-no-files-found: error

      # "v1.0.0" gibi bir tag push'lanırsa GitHub Release'e de ekle
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
